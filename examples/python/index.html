<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastSlide XYZ Viewer</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/ol@v10.3.1/ol.css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/ol@v10.3.1/dist/ol.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: "#f0f9ff",
                100: "#e0f2fe",
                400: "#38bdf8",
                500: "#0ea5e9",
                600: "#0284c7",
                700: "#0369a1",
              },
            },
          },
        },
      };
    </script>
    <style>
      .ol-control button {
        background-color: white !important;
        color: #374151 !important;
        border: 1px solid #d1d5db !important;
      }
      .ol-control button:hover {
        background-color: #f3f4f6 !important;
      }
      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
      #map {
        flex: 1;
        width: 100%;
        background: #111827;
      }
      #sidebar {
        scrollbar-width: thin;
        scrollbar-color: #4b5563 transparent;
        transition: width 0.2s ease, opacity 0.2s ease;
      }
      #sidebar.collapsed {
        width: 0 !important;
        opacity: 0;
        overflow: hidden;
        border: 0;
      }
      #sidebar::-webkit-scrollbar {
        width: 6px;
      }
      #sidebar::-webkit-scrollbar-thumb {
        background-color: #4b5563;
        border-radius: 3px;
      }
      /* Scale bar styled for the dark background. */
      .ol-scale-line {
        background: rgba(31, 41, 55, 0.8);
        border-radius: 4px;
        bottom: 12px;
        left: 12px;
        padding: 2px;
      }
      .ol-scale-line-inner {
        color: #e5e7eb;
        border-color: #e5e7eb;
        font-size: 11px;
      }
    </style>
  </head>

  <body class="bg-gray-900 text-gray-100 font-sans antialiased">
    <header
      class="bg-gray-800 border-b border-gray-700 shadow-sm z-10 shrink-0"
    >
      <div
        class="max-w-full mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between"
      >
        <div class="flex items-center gap-3">
          <button
            id="sidebar-toggle"
            title="Toggle sidebar"
            class="p-2 rounded-lg text-gray-300 hover:bg-gray-700 transition-colors"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              class="w-5 h-5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
              />
            </svg>
          </button>
          <div class="bg-primary-600 text-white p-1.5 rounded-lg">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              class="w-6 h-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5z"
              />
            </svg>
          </div>
          <h1 class="text-xl font-bold tracking-tight text-white">
            FastSlide <span class="text-primary-500">XYZ</span>
          </h1>
        </div>

        <div
          id="slide-nav"
          class="flex items-center gap-2 min-w-0 flex-1 justify-center px-2"
        >
          <button
            id="slide-prev"
            type="button"
            title="Previous slide"
            class="hidden shrink-0 rounded-lg p-2 text-gray-300 hover:bg-gray-700 hover:text-white disabled:opacity-30 disabled:pointer-events-none transition-colors"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              class="w-5 h-5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 19.5L8.25 12l7.5-7.5"
              />
            </svg>
          </button>
          <h2
            id="header-slide-name"
            class="min-w-0 flex-1 truncate text-center text-sm font-medium text-gray-200 sm:text-base"
          ></h2>
          <button
            id="slide-next"
            type="button"
            title="Next slide"
            class="hidden shrink-0 rounded-lg p-2 text-gray-300 hover:bg-gray-700 hover:text-white disabled:opacity-30 disabled:pointer-events-none transition-colors"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              class="w-5 h-5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M8.25 4.5l7.5 7.5-7.5 7.5"
              />
            </svg>
          </button>
        </div>

        <div class="flex items-center gap-3 shrink-0">
          <a
            id="files-link"
            href="/"
            class="hidden inline-flex items-center gap-1.5 rounded-lg bg-gray-700 px-3 py-1.5 text-sm font-medium text-gray-100 hover:bg-gray-600 transition-colors"
            title="Back to file browser"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              class="w-4 h-4"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z"
              />
            </svg>
            Files
          </a>
          <label class="text-sm text-gray-400">Tile format</label>
          <select
            id="format-select"
            class="rounded-lg bg-gray-900 border border-gray-700 text-gray-200 text-sm py-1.5 px-3 focus:border-primary-500 focus:ring-primary-500"
          >
            <option value="jpg">JPEG</option>
            <option value="png">PNG</option>
          </select>
        </div>
      </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
      <aside
        id="sidebar"
        class="w-80 bg-gray-800 border-r border-gray-700 flex-shrink-0 overflow-y-auto"
      >
        <div class="p-6 space-y-6">
          <div id="image-switcher" class="hidden">
            <h2 class="text-lg font-semibold text-primary-400 mb-4">Image</h2>
            <select
              id="image-select"
              class="w-full rounded-lg bg-gray-900 border border-gray-700 text-gray-200 text-sm py-2 px-3 focus:border-primary-500 focus:ring-primary-500"
            ></select>
          </div>

          <div>
            <h2 class="text-lg font-semibold text-primary-400 mb-4">
              Slide Details
            </h2>
            <div
              class="space-y-3 bg-gray-900/50 p-4 rounded-xl border border-gray-700/50"
            >
              <div class="flex justify-between text-sm">
                <span class="text-gray-500">Name</span>
                <span
                  class="font-medium text-gray-200 truncate ml-2"
                  id="info-name"
                  >-</span
                >
              </div>
              <div class="flex justify-between text-sm">
                <span class="text-gray-500">Format</span>
                <span class="font-medium text-gray-200" id="info-format"
                  >-</span
                >
              </div>
              <div class="flex justify-between text-sm">
                <span class="text-gray-500">Dimensions</span>
                <span class="font-medium text-gray-200" id="info-dimensions"
                  >-</span
                >
              </div>
              <div class="flex justify-between text-sm">
                <span class="text-gray-500">MPP (µm/px)</span>
                <span class="font-medium text-gray-200" id="info-mpp">-</span>
              </div>
              <div class="flex justify-between text-sm">
                <span class="text-gray-500">Native levels</span>
                <span class="font-medium text-gray-200" id="info-levels"
                  >-</span
                >
              </div>
              <div class="flex justify-between text-sm">
                <span class="text-gray-500">Zoom levels</span>
                <span class="font-medium text-gray-200" id="info-zoom">-</span>
              </div>
              <div class="flex justify-between text-sm">
                <span class="text-gray-500">Tile size</span>
                <span class="font-medium text-gray-200" id="info-tile">-</span>
              </div>
            </div>
          </div>

          <div>
            <h2 class="text-lg font-semibold text-primary-400 mb-4">
              Annotations
            </h2>
            <div
              class="space-y-4 bg-gray-900/50 p-4 rounded-xl border border-gray-700/50"
            >
              <label
                class="flex items-center justify-between text-sm cursor-pointer"
              >
                <span class="text-gray-300">Show annotations</span>
                <input
                  id="annotation-toggle"
                  type="checkbox"
                  checked
                  class="h-4 w-4 rounded border-gray-600 bg-gray-900 text-primary-500 focus:ring-primary-500"
                />
              </label>

              <div class="border-t border-gray-700/50 pt-3">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-xs font-medium uppercase tracking-wide text-gray-500"
                    >Layers</span
                  >
                  <span class="text-xs text-gray-500" id="annotation-count"
                    >0 layers, 0 features</span
                  >
                </div>
                <div id="annotation-list" class="space-y-3 max-h-96 overflow-y-auto pr-1">
                  <p class="text-xs text-gray-600">No annotation layers loaded.</p>
                </div>
              </div>

              <div>
                <label class="block text-xs text-gray-500 mb-1"
                  >Load GeoJSON file(s)</label
                >
                <input
                  id="annotation-file"
                  type="file"
                  multiple
                  accept=".json,.geojson,application/json,application/geo+json"
                  class="block w-full text-xs text-gray-400 file:mr-3 file:rounded-lg file:border-0 file:bg-primary-600 file:px-3 file:py-1.5 file:text-sm file:font-medium file:text-white hover:file:bg-primary-700 cursor-pointer"
                />
              </div>
            </div>
          </div>

          <div>
            <h2 class="text-lg font-semibold text-primary-400 mb-4">Heatmaps</h2>
            <div
              class="space-y-3 bg-gray-900/50 p-4 rounded-xl border border-gray-700/50"
            >
              <div class="flex items-center justify-between">
                <span class="text-xs font-medium uppercase tracking-wide text-gray-500"
                  >Overlays</span
                >
                <span class="text-xs text-gray-500" id="heatmap-count"
                  >0 heatmaps</span
                >
              </div>
              <div
                id="heatmap-list"
                class="space-y-3 max-h-72 overflow-y-auto pr-1"
              >
                <p class="text-xs text-gray-600">No heatmaps loaded.</p>
              </div>
            </div>
          </div>
        </div>
      </aside>

      <div id="viewer-container" class="flex-1 relative bg-gray-900">
        <div id="map" class="absolute inset-0"></div>
      </div>
    </main>

    <script>
      let map = null;
      let layer = null;
      let slideInfo = null;
      let currentImageIndex = 0;
      // The current image's pixel projection, needed to georeference heatmaps.
      let currentProjection = null;

      // --- Heatmaps ------------------------------------------------------
      // A heatmap is a low-resolution intensity image overlaid on a region of
      // the slide. The server returns each heatmap's pre-rendered PNG plus its
      // map extent (already in level-0 px with y negated), so the viewer just
      // draws one georeferenced image. Each has its own opacity (alpha) slider.
      let heatmapGroups = []; // [{ name, title, extent, width, height, layer, visible, opacity }]

      // --- Annotations ---------------------------------------------------
      // GeoJSON coordinates are in level-0 slide pixels with the origin at the
      // top-left and y pointing down. The map projection uses the same x but a
      // downward-negative y (extent [0, -height, width, 0]), so the only
      // transform needed is y -> -y. Point geometries are drawn as circles of a
      // fixed physical diameter (mm); other geometries are drawn as-is.
      //
      // Every annotation file for a slide becomes its own "group": a vector
      // source/layer plus a visibility flag, so each can be toggled on its own.
      const geojsonFormat = new ol.format.GeoJSON();
      let annotationGroups = []; // [{ name, data, source, layer, visible }]
      let pointDiameterMm = 2.1; // physical diameter of point circles, in mm
      let annotationsVisible = true; // master toggle for all groups

      const ANNOTATION_PALETTE = [
        "#f87171",
        "#fbbf24",
        "#34d399",
        "#60a5fa",
        "#c084fc",
        "#f472b6",
        "#22d3ee",
        "#a3e635",
      ];
      const classColors = {};

      function colorForClass(name) {
        const key = name || "__default__";
        if (!(key in classColors)) {
          const idx = Object.keys(classColors).length % ANNOTATION_PALETTE.length;
          classColors[key] = ANNOTATION_PALETTE[idx];
        }
        return classColors[key];
      }

      function classNameOf(props) {
        return props && props.classification && props.classification.name
          ? props.classification.name
          : null;
      }

      // Distinct classification names present in a GeoJSON object, for display
      // in the sidebar panel (the names are not drawn on the image).
      function classNamesOf(data) {
        const names = [];
        if (!data || !Array.isArray(data.features)) return names;
        data.features.forEach((f) => {
          const name = classNameOf(f.properties || {});
          if (name && !names.includes(name)) names.push(name);
        });
        return names;
      }

      // Returns the [r, g, b] color for a feature: the GeoJSON
      // classification.color when present, otherwise a palette color keyed by
      // the classification name.
      function rgbForFeature(props) {
        const c = props && props.classification && props.classification.color;
        if (Array.isArray(c) && c.length >= 3) {
          return [c[0] | 0, c[1] | 0, c[2] | 0];
        }
        const hex = colorForClass(classNameOf(props));
        const n = parseInt(hex.slice(1), 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      }

      function cssRgb(rgb, alpha) {
        return alpha == null
          ? `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`
          : `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${alpha})`;
      }

      function hexToRgb(hex) {
        const n = parseInt(hex.slice(1), 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      }

      function rgbToHex(rgb) {
        const h = (v) =>
          Math.max(0, Math.min(255, v | 0)).toString(16).padStart(2, "0");
        return `#${h(rgb[0])}${h(rgb[1])}${h(rgb[2])}`;
      }

      function dataHasPoints(data) {
        if (!data || !Array.isArray(data.features)) return false;
        return data.features.some((f) => {
          const t = f.geometry && f.geometry.type;
          return t === "Point" || t === "MultiPoint";
        });
      }

      // The color shown in a layer's color picker: the per-layer override if
      // set, else the color of its first feature (classification color/palette).
      function groupColorHex(group) {
        if (group.colorOverride) return group.colorOverride;
        const feats = group.source.getFeatures();
        const props = feats.length ? feats[0].getProperties() : {};
        return rgbToHex(rgbForFeature(props));
      }

      // Flip the y axis in-place for a flat coordinate array (works for any
      // geometry dimensionality/stride).
      function flipY(input, output, stride) {
        output = output || input;
        for (let i = 0; i < input.length; i += stride) {
          output[i] = input[i];
          output[i + 1] = -input[i + 1];
          for (let k = 2; k < stride; k++) output[i + k] = input[i + k];
        }
        return output;
      }

      function makeCircleFeature(coord, radius, props) {
        const feature = new ol.Feature(
          new ol.geom.Circle([coord[0], -coord[1]], radius)
        );
        feature.setProperties(props || {});
        return feature;
      }

      // Builds a style function bound to one layer/group, so the layer's own
      // color and outline width are applied. No on-image text labels are drawn:
      // classification names are shown only in the sidebar panel. Point circles
      // are outline-only; region geometries keep a faint translucent fill.
      function makeGroupStyle(group) {
        return function (feature) {
          const geom = feature.getGeometry();
          const isCircle = geom && geom.getType() === "Circle";
          const rgb = group.colorOverride
            ? hexToRgb(group.colorOverride)
            : rgbForFeature(feature.getProperties());
          return new ol.style.Style({
            stroke: new ol.style.Stroke({
              color: cssRgb(rgb),
              width: group.strokeWidth,
            }),
            fill: isCircle
              ? undefined
              : new ol.style.Fill({ color: cssRgb(rgb, 0.15) }),
          });
        };
      }

      function updateAnnotationCount() {
        const el = document.getElementById("annotation-count");
        if (!el) return;
        let n = 0;
        annotationGroups.forEach((g) => (n += g.source.getFeatures().length));
        const layers = annotationGroups.length;
        el.textContent = `${layers} layer${layers === 1 ? "" : "s"}, ${n} feature${
          n === 1 ? "" : "s"
        }`;
      }

      // Mean microns-per-pixel of the current image, or null if the slide has
      // no physical scale. Map units are level-0 pixels, so converting a
      // physical length to map units uses this scale directly.
      function currentImageMpp() {
        if (!slideInfo || !slideInfo.images) return null;
        const image = slideInfo.images[currentImageIndex];
        if (!image || !image.mpp) return null;
        const [mx, my] = image.mpp;
        return (mx + my) / 2;
      }

      // Converts a physical diameter (mm) to a circle radius in level-0 pixels
      // using the current image's MPP. Returns null when the scale is unknown.
      function pointRadiusForMm(mm) {
        const mpp = currentImageMpp(); // microns per pixel
        if (!mpp || mpp <= 0 || !(mm > 0)) return null;
        return (mm * 1000) / mpp / 2;
      }

      // Builds OpenLayers features from one GeoJSON object, converting points to
      // circles of the given radius (px) and flipping y for every geometry.
      function buildFeatures(data, radius) {
        const out = [];
        if (!data || !Array.isArray(data.features)) return out;
        data.features.forEach((feature) => {
          const geom = feature.geometry;
          if (!geom) return;
          const props = Object.assign({}, feature.properties || {});
          if (geom.type === "Point" || geom.type === "MultiPoint") {
            // Point circles need a physical scale; skip them if MPP is unknown.
            if (radius === null) return;
            const coords =
              geom.type === "Point" ? [geom.coordinates] : geom.coordinates;
            coords.forEach((c) => out.push(makeCircleFeature(c, radius, props)));
          } else {
            let olGeom;
            try {
              olGeom = geojsonFormat.readGeometry(geom);
            } catch (err) {
              return;
            }
            olGeom.applyTransform(flipY);
            const olFeature = new ol.Feature(olGeom);
            olFeature.setProperties(props);
            out.push(olFeature);
          }
        });
        return out;
      }

      // Recompute the features of a single group using its own circle diameter.
      function rebuildGroupFeatures(group) {
        const radius = pointRadiusForMm(group.diameterMm);
        group.source.clear();
        group.source.addFeatures(buildFeatures(group.data, radius));
        updateAnnotationCount();
      }

      // Recompute features for every group (e.g. when the image, and therefore
      // the MPP, changes).
      function rebuildAllAnnotationFeatures() {
        annotationGroups.forEach((g) => {
          g.source.clear();
          g.source.addFeatures(buildFeatures(g.data, pointRadiusForMm(g.diameterMm)));
        });
        updateAnnotationCount();
      }

      // (Re)create a vector layer per group on the current map. Layers are
      // rebuilt fresh because the map itself is recreated on image/format
      // changes, but the underlying sources persist.
      function syncAnnotationLayers() {
        if (!map) return;
        annotationGroups.forEach((g) => {
          if (g.layer) {
            try {
              map.removeLayer(g.layer);
            } catch (err) {
              /* layer not on this map */
            }
          }
          g.layer = new ol.layer.Vector({
            source: g.source,
            style: makeGroupStyle(g),
            visible: annotationsVisible && g.visible,
            opacity: g.opacity,
            zIndex: 10, // annotations render above heatmaps
          });
          map.addLayer(g.layer);
        });
      }

      function setAnnotationsVisible(visible) {
        annotationsVisible = visible;
        annotationGroups.forEach((g) => {
          if (g.layer) g.layer.setVisible(annotationsVisible && g.visible);
        });
      }

      // Small labeled control wrapper used by the per-layer customization grid.
      function controlField(labelText, inputEl) {
        const wrap = document.createElement("label");
        wrap.className = "flex flex-col gap-1 text-xs text-gray-500";
        const span = document.createElement("span");
        span.textContent = labelText;
        wrap.appendChild(span);
        wrap.appendChild(inputEl);
        return wrap;
      }

      // Renders each annotation layer with its name and its own customization
      // controls (color, outline width, opacity, and circle diameter for point
      // layers) directly beneath it.
      function renderAnnotationList() {
        const container = document.getElementById("annotation-list");
        if (!container) return;
        container.innerHTML = "";
        if (annotationGroups.length === 0) {
          container.innerHTML =
            '<p class="text-xs text-gray-600">No annotation layers loaded.</p>';
          return;
        }

        annotationGroups.forEach((g) => {
          const card = document.createElement("div");
          card.className =
            "rounded-lg border border-gray-700/60 bg-gray-900/40 p-3 space-y-3";

          // Header: classification name(s) (fall back to file name) + visibility.
          const header = document.createElement("div");
          header.className = "flex items-start justify-between gap-2";
          const classes = classNamesOf(g.data);
          const label = classes.length ? classes.join(", ") : g.name;
          const title = document.createElement("div");
          title.className = "text-sm font-medium text-gray-200 truncate";
          title.textContent = label;
          title.title = label;
          const visible = document.createElement("input");
          visible.type = "checkbox";
          visible.checked = g.visible;
          visible.title = "Show this layer";
          visible.className =
            "mt-0.5 h-4 w-4 rounded border-gray-600 bg-gray-900 text-primary-500 focus:ring-primary-500 shrink-0 cursor-pointer";
          visible.addEventListener("change", () => {
            g.visible = visible.checked;
            if (g.layer) g.layer.setVisible(annotationsVisible && g.visible);
          });
          header.appendChild(title);
          header.appendChild(visible);
          card.appendChild(header);

          // Customization grid.
          const grid = document.createElement("div");
          grid.className = "grid grid-cols-2 gap-x-3 gap-y-2";

          const inputBase =
            "rounded-md bg-gray-900 border border-gray-700 text-gray-200 text-xs focus:border-primary-500 focus:ring-primary-500";

          // Color.
          const color = document.createElement("input");
          color.type = "color";
          color.value = groupColorHex(g);
          color.className = "h-7 w-full rounded-md bg-gray-900 border border-gray-700 cursor-pointer";
          color.addEventListener("input", () => {
            g.colorOverride = color.value;
            if (g.layer) g.layer.setStyle(makeGroupStyle(g));
          });
          grid.appendChild(controlField("Color", color));

          // Outline width (px).
          const width = document.createElement("input");
          width.type = "number";
          width.min = "0.5";
          width.step = "0.5";
          width.value = String(g.strokeWidth);
          width.className = inputBase + " py-1 px-2";
          width.addEventListener("change", () => {
            const v = parseFloat(width.value);
            if (v > 0) {
              g.strokeWidth = v;
              if (g.layer) g.layer.setStyle(makeGroupStyle(g));
            }
          });
          grid.appendChild(controlField("Outline (px)", width));

          // Opacity (0-100%).
          const opacity = document.createElement("input");
          opacity.type = "range";
          opacity.min = "0";
          opacity.max = "100";
          opacity.value = String(Math.round(g.opacity * 100));
          opacity.className = "w-full accent-primary-500 cursor-pointer";
          opacity.addEventListener("input", () => {
            g.opacity = parseInt(opacity.value, 10) / 100;
            if (g.layer) g.layer.setOpacity(g.opacity);
          });
          grid.appendChild(controlField("Opacity", opacity));

          // Circle diameter (mm) -- only for layers that contain points.
          if (g.hasPoints) {
            const diameter = document.createElement("input");
            diameter.type = "number";
            diameter.min = "0.01";
            diameter.step = "0.01";
            diameter.value = String(g.diameterMm);
            diameter.className = inputBase + " py-1 px-2";
            diameter.addEventListener("change", () => {
              const v = parseFloat(diameter.value);
              if (v > 0) {
                g.diameterMm = v;
                rebuildGroupFeatures(g);
              }
            });
            grid.appendChild(controlField("Diameter (mm)", diameter));
          }

          card.appendChild(grid);
          container.appendChild(card);
        });
      }

      // Appends new annotation groups, builds their features, wires up layers,
      // and refreshes the sidebar list.
      function addAnnotationGroups(entries) {
        entries.forEach((entry) => {
          annotationGroups.push({
            name: entry.name,
            data: entry.data,
            source: new ol.source.Vector(),
            layer: null,
            visible: true,
            // Per-layer customization (editable in the sidebar):
            hasPoints: dataHasPoints(entry.data),
            colorOverride: null, // hex string; null = use feature/class color
            strokeWidth: 2,
            opacity: 1,
            diameterMm: pointDiameterMm, // circle diameter for point geometries
          });
        });
        rebuildAllAnnotationFeatures();
        syncAnnotationLayers();
        renderAnnotationList();
      }

      async function loadAnnotationsFromServer() {
        try {
          const resp = await fetch(withSlide("/annotations"));
          if (!resp.ok) return;
          const data = await resp.json();
          const list = Array.isArray(data.annotations) ? data.annotations : [];
          addAnnotationGroups(
            list.map((a) => ({ name: a.name, data: a.geojson }))
          );
        } catch (err) {
          // No annotations available; leave the overlay empty.
        }
      }

      // Loads one or more local GeoJSON files, each as its own layer.
      function loadAnnotationsFromFiles(fileList) {
        const files = Array.from(fileList);
        let pending = files.length;
        const entries = [];
        const done = () => {
          if (--pending === 0 && entries.length) addAnnotationGroups(entries);
        };
        files.forEach((file) => {
          const reader = new FileReader();
          reader.onload = () => {
            try {
              entries.push({
                name: file.name.replace(/\.(geo)?json$/i, ""),
                data: JSON.parse(reader.result),
              });
            } catch (err) {
              alert(`Could not parse ${file.name} as GeoJSON.`);
            }
            done();
          };
          reader.onerror = done;
          reader.readAsText(file);
        });
      }

      // --- Heatmap overlays ----------------------------------------------
      // Standard colormaps offered for heatmaps (rendered server-side).
      const HEATMAP_COLORMAPS = [
        "jet",
        "turbo",
        "viridis",
        "inferno",
        "magma",
        "plasma",
        "hot",
        "gray",
      ];

      function heatmapImageUrl(name, cmap) {
        return withSlide(
          "/heatmap.png?name=" +
            encodeURIComponent(name) +
            "&cmap=" +
            encodeURIComponent(cmap || "jet")
        );
      }

      function heatmapColorbarUrl(cmap) {
        return withSlide(
          "/heatmap-colorbar.png?cmap=" +
            encodeURIComponent(cmap || "jet") +
            "&width=160&height=24"
        );
      }

      function formatHeatmapValue(value) {
        if (value == null || !Number.isFinite(value)) return "—";
        const abs = Math.abs(value);
        if (abs >= 100) return value.toFixed(0);
        if (abs >= 10) return value.toFixed(1);
        return value.toFixed(2);
      }

      function updateHeatmapCount() {
        const el = document.getElementById("heatmap-count");
        if (!el) return;
        const n = heatmapGroups.length;
        el.textContent = `${n} heatmap${n === 1 ? "" : "s"}`;
      }

      // (Re)create the image layer for each heatmap on the current map, using
      // the current image's projection for georeferencing.
      function syncHeatmapLayers() {
        if (!map || !currentProjection) return;
        heatmapGroups.forEach((g) => {
          if (g.layer) {
            try {
              map.removeLayer(g.layer);
            } catch (err) {
              /* layer not on this map */
            }
          }
          g.layer = new ol.layer.Image({
            source: new ol.source.ImageStatic({
              url: heatmapImageUrl(g.name, g.colormap),
              imageExtent: g.extent,
              projection: currentProjection,
              interpolate: false, // crisp cells, no smoothing
            }),
            opacity: g.opacity,
            visible: g.visible,
            zIndex: 5, // below annotation layers (zIndex 10), above tiles
          });
          map.addLayer(g.layer);
        });
      }

      // Renders each heatmap with a visibility toggle and an alpha slider.
      function renderHeatmapList() {
        const container = document.getElementById("heatmap-list");
        if (!container) return;
        container.innerHTML = "";
        updateHeatmapCount();
        if (heatmapGroups.length === 0) {
          container.innerHTML =
            '<p class="text-xs text-gray-600">No heatmaps loaded.</p>';
          return;
        }
        heatmapGroups.forEach((g) => {
          const card = document.createElement("div");
          card.className =
            "rounded-lg border border-gray-700/60 bg-gray-900/40 p-3 space-y-2";

          const header = document.createElement("div");
          header.className = "flex items-start justify-between gap-2";
          const label = g.title || g.name;
          const title = document.createElement("div");
          title.className = "text-sm font-medium text-gray-200 truncate";
          title.textContent = label;
          title.title = label;
          const visible = document.createElement("input");
          visible.type = "checkbox";
          visible.checked = g.visible;
          visible.title = "Show this heatmap";
          visible.className =
            "mt-0.5 h-4 w-4 rounded border-gray-600 bg-gray-900 text-primary-500 focus:ring-primary-500 shrink-0 cursor-pointer";
          visible.addEventListener("change", () => {
            g.visible = visible.checked;
            if (g.layer) g.layer.setVisible(g.visible);
          });
          header.appendChild(title);
          header.appendChild(visible);
          card.appendChild(header);

          const field = document.createElement("label");
          field.className = "flex items-center gap-2 text-xs text-gray-500";
          const span = document.createElement("span");
          span.textContent = "Alpha";
          const alpha = document.createElement("input");
          alpha.type = "range";
          alpha.min = "0";
          alpha.max = "100";
          alpha.value = String(Math.round(g.opacity * 100));
          alpha.className = "w-full accent-primary-500 cursor-pointer";
          alpha.addEventListener("input", () => {
            g.opacity = parseInt(alpha.value, 10) / 100;
            if (g.layer) g.layer.setOpacity(g.opacity);
          });
          field.appendChild(span);
          field.appendChild(alpha);
          card.appendChild(field);

          const cmapField = document.createElement("label");
          cmapField.className =
            "flex items-center gap-2 text-xs text-gray-500";
          const cmapSpan = document.createElement("span");
          cmapSpan.textContent = "Colormap";
          const cmapSelect = document.createElement("select");
          cmapSelect.className =
            "flex-1 rounded-md border border-gray-700 bg-gray-900 px-2 py-1 text-xs text-gray-200 focus:ring-primary-500 cursor-pointer";
          HEATMAP_COLORMAPS.forEach((name) => {
            const opt = document.createElement("option");
            opt.value = name;
            opt.textContent = name;
            if (name === g.colormap) opt.selected = true;
            cmapSelect.appendChild(opt);
          });

          const colorbarWrap = document.createElement("div");
          colorbarWrap.className = "space-y-1 pt-1";
          const colorbarImg = document.createElement("img");
          colorbarImg.alt = "";
          colorbarImg.className =
            "w-full h-6 rounded border border-gray-700/80 object-fill";
          colorbarImg.src = heatmapColorbarUrl(g.colormap);
          const colorbarLabels = document.createElement("div");
          colorbarLabels.className =
            "flex justify-between text-xs tabular-nums text-gray-500";
          const minLabel = document.createElement("span");
          minLabel.textContent = "0";
          const maxLabel = document.createElement("span");
          maxLabel.textContent = formatHeatmapValue(g.maxValue);
          colorbarLabels.appendChild(minLabel);
          colorbarLabels.appendChild(maxLabel);
          colorbarWrap.appendChild(colorbarImg);
          colorbarWrap.appendChild(colorbarLabels);

          cmapSelect.addEventListener("change", () => {
            g.colormap = cmapSelect.value;
            colorbarImg.src = heatmapColorbarUrl(g.colormap);
            // Re-fetch the heatmap image rendered with the new colormap.
            if (g.layer) {
              g.layer.setSource(
                new ol.source.ImageStatic({
                  url: heatmapImageUrl(g.name, g.colormap),
                  imageExtent: g.extent,
                  projection: currentProjection,
                  interpolate: false,
                })
              );
            }
          });
          cmapField.appendChild(cmapSpan);
          cmapField.appendChild(cmapSelect);
          card.appendChild(cmapField);
          card.appendChild(colorbarWrap);

          container.appendChild(card);
        });
      }

      async function loadHeatmapsFromServer() {
        try {
          const resp = await fetch(withSlide("/heatmaps"));
          if (!resp.ok) return;
          const data = await resp.json();
          const list = Array.isArray(data.heatmaps) ? data.heatmaps : [];
          heatmapGroups = list.map((h) => ({
            name: h.name,
            title: h.title || h.name,
            extent: h.extent.map(Number),
            width: h.width,
            height: h.height,
            maxValue: h.max_value,
            layer: null,
            visible: true,
            opacity: 0.6,
            colormap: "jet",
          }));
          syncHeatmapLayers();
          renderHeatmapList();
        } catch (err) {
          // No heatmaps available; leave the overlay empty.
        }
      }

      // When served by the multi-image (folder) server, the slide to view is
      // passed as a ?slide=<relpath> query param that must be forwarded to the
      // /info and /tiles endpoints. The single-slide server ignores it.
      const slideParam = new URLSearchParams(window.location.search).get(
        "slide"
      );
      let slideList = [];

      function goToSlide(relpath) {
        window.location.href =
          "/viewer?slide=" + encodeURIComponent(relpath);
      }

      async function initSlideNav() {
        const prevBtn = document.getElementById("slide-prev");
        const nextBtn = document.getElementById("slide-next");
        if (!slideParam) {
          return;
        }
        prevBtn.classList.remove("hidden");
        nextBtn.classList.remove("hidden");
        try {
          const resp = await fetch("/api/slides");
          if (!resp.ok) return;
          const data = await resp.json();
          slideList = (data.slides || []).map((s) => s.path).sort();
        } catch (err) {
          return;
        }
        const idx = slideList.indexOf(slideParam);
        if (idx < 0) return;
        prevBtn.disabled = idx <= 0;
        nextBtn.disabled = idx >= slideList.length - 1;
        prevBtn.onclick = () => {
          if (idx > 0) goToSlide(slideList[idx - 1]);
        };
        nextBtn.onclick = () => {
          if (idx < slideList.length - 1) goToSlide(slideList[idx + 1]);
        };
      }

      function updateHeaderSlideName() {
        const name = slideInfo ? slideInfo.name || "-" : "-";
        const el = document.getElementById("header-slide-name");
        if (el) {
          el.textContent = name;
          el.title = name;
        }
        if (slideInfo && slideInfo.name) {
          document.title = slideInfo.name + " – FastSlide XYZ";
        }
      }

      function withSlide(url) {
        if (!slideParam) return url;
        const sep = url.includes("?") ? "&" : "?";
        return url + sep + "slide=" + encodeURIComponent(slideParam);
      }

      function currentImage() {
        return slideInfo.images[currentImageIndex];
      }

      function tileUrl(imageIndex, z, x, y, ext) {
        return withSlide(`/tiles/${imageIndex}/${z}/${x}/${y}.${ext}`);
      }

      function buildSource(image, ext) {
        const [width, height] = image.dimensions;
        const tileSize = image.tile_size;

        // Coordinate system: image pixels, y pointing down. The extent's top
        // edge is y=0 and the bottom edge is y=-height, with the tile grid
        // origin anchored at the top-left so XYZ rows increase downward.
        const extent = [0, -height, width, 0];

        // One zoom level per native pyramid level; resolutions are the slide's
        // own downsamples (not necessarily powers of two). OpenLayers scales
        // between these client-side, so the server never resamples.
        const resolutions = image.resolutions.slice();

        // Set meters-per-unit from MPP so the scale bar reads in real units
        // (1 map unit = 1 level-0 pixel = mpp_x microns = mpp_x * 1e-6 m).
        const projOpts = {
          code: "fastslide-pixels",
          units: "pixels",
          extent: extent,
        };
        if (image.mpp) {
          projOpts.metersPerUnit = image.mpp[0] * 1e-6;
        }
        const projection = new ol.proj.Projection(projOpts);

        const tileGrid = new ol.tilegrid.TileGrid({
          extent: extent,
          origin: [0, 0],
          resolutions: resolutions,
          tileSize: tileSize,
        });

        const source = new ol.source.XYZ({
          projection: projection,
          tileGrid: tileGrid,
          wrapX: false,
          tileUrlFunction: function (tileCoord) {
            if (!tileCoord) return undefined;
            const z = tileCoord[0];
            const x = tileCoord[1];
            const y = tileCoord[2];
            if (x < 0 || y < 0) return undefined;
            return tileUrl(image.index, z, x, y, ext);
          },
        });

        return { source, projection, resolutions, extent };
      }

      function createMap(image, ext) {
        const { source, projection, resolutions, extent } = buildSource(
          image,
          ext
        );

        layer = new ol.layer.Tile({ source });

        if (map) {
          map.setTarget(null);
          map = null;
        }

        // The tile grid only goes as coarse as the slide's coarsest native
        // level (resolutions[0]). To let the user zoom out far enough to fit
        // the whole slide, give the View extra coarser steps; OpenLayers scales
        // the coarsest tiles down for those without requesting new tiles.
        const [width, height] = image.dimensions;
        const viewResolutions = resolutions.slice();
        const maxRes = Math.max(width, height) / 200;
        let currentMax = viewResolutions[0];
        while (currentMax < maxRes) {
          currentMax *= 2;
          viewResolutions.unshift(currentMax);
        }

        const controls = ol.control.defaults
          .defaults()
          .extend([new ol.control.FullScreen(), new ol.control.ZoomSlider()]);
        if (image.mpp) {
          controls.extend([
            new ol.control.ScaleLine({ units: "metric", minWidth: 80 }),
          ]);
        }

        map = new ol.Map({
          target: "map",
          layers: [layer],
          view: new ol.View({
            projection: projection,
            resolutions: viewResolutions,
            extent: extent,
            constrainOnlyCenter: true,
            showFullExtent: true,
            enableRotation: false,
          }),
          controls: controls,
        });

        map.getView().fit(extent, { padding: [20, 20, 20, 20] });

        // The map was just recreated; re-attach overlay layers. Heatmaps sit
        // below annotations (z-index ordering is set on the layers themselves).
        currentProjection = projection;
        syncHeatmapLayers();
        syncAnnotationLayers();
      }

      function populateImageSwitcher() {
        const switcher = document.getElementById("image-switcher");
        const select = document.getElementById("image-select");
        select.innerHTML = "";
        if (slideInfo.images.length <= 1) {
          switcher.classList.add("hidden");
          return;
        }
        switcher.classList.remove("hidden");
        slideInfo.images.forEach((img) => {
          const option = document.createElement("option");
          option.value = img.index;
          const label = img.name || `Image ${img.index}`;
          option.textContent = `${label} (${img.dimensions[0]}×${img.dimensions[1]})`;
          select.appendChild(option);
        });
        select.value = currentImageIndex;
      }

      function populateSidebar() {
        const image = currentImage();
        updateHeaderSlideName();
        document.getElementById("info-name").textContent =
          slideInfo.name || "-";
        document.getElementById("info-format").textContent =
          slideInfo.format || "-";
        const dims = `${image.dimensions[0]} × ${image.dimensions[1]}`;
        document.getElementById("info-dimensions").textContent = dims;
        document.getElementById("info-mpp").textContent = image.mpp
          ? ((image.mpp[0] + image.mpp[1]) / 2).toFixed(4)
          : "N/A";
        document.getElementById("info-levels").textContent = image.level_count;
        document.getElementById(
          "info-zoom"
        ).textContent = `${image.min_zoom} – ${image.max_zoom}`;
        document.getElementById(
          "info-tile"
        ).textContent = `${image.tile_size} px`;
      }

      function selectImage(index) {
        currentImageIndex = index;
        populateSidebar();
        createMap(
          currentImage(),
          document.getElementById("format-select").value
        );
        // Point circle sizes depend on the image's MPP, so rebuild on switch.
        rebuildAllAnnotationFeatures();
      }

      async function init() {
        if (slideParam) {
          document.getElementById("files-link").classList.remove("hidden");
        }
        const resp = await fetch(withSlide("/info"));
        if (!resp.ok) {
          document.getElementById("map").innerHTML =
            '<div class="flex items-center justify-center h-full text-red-400">Failed to load slide info</div>';
          return;
        }
        slideInfo = await resp.json();
        currentImageIndex = slideInfo.primary_index || 0;
        updateHeaderSlideName();

        await initSlideNav();
        populateImageSwitcher();
        await loadHeatmapsFromServer();
        loadAnnotationsFromServer();
        selectImage(currentImageIndex);

        document
          .getElementById("format-select")
          .addEventListener("change", (e) => {
            createMap(currentImage(), e.target.value);
          });

        document
          .getElementById("annotation-toggle")
          .addEventListener("change", (e) => {
            setAnnotationsVisible(e.target.checked);
          });

        document
          .getElementById("annotation-file")
          .addEventListener("change", (e) => {
            if (e.target.files && e.target.files.length) {
              loadAnnotationsFromFiles(e.target.files);
            }
            e.target.value = ""; // allow re-selecting the same file(s)
          });

        document
          .getElementById("image-select")
          .addEventListener("change", (e) => {
            selectImage(parseInt(e.target.value, 10));
          });

        document
          .getElementById("sidebar-toggle")
          .addEventListener("click", () => {
            document.getElementById("sidebar").classList.toggle("collapsed");
            // Let the layout settle before OpenLayers recomputes its size.
            setTimeout(() => map && map.updateSize(), 220);
          });
      }

      init();
    </script>
  </body>
</html>

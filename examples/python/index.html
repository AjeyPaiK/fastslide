<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastSlide XYZ Viewer</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/ol@v10.3.1/ol.css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/ol@v10.3.1/dist/ol.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: "#f0f9ff",
                100: "#e0f2fe",
                400: "#38bdf8",
                500: "#0ea5e9",
                600: "#0284c7",
                700: "#0369a1",
              },
            },
          },
        },
      };
    </script>
    <style>
      .ol-control button {
        background-color: white !important;
        color: #374151 !important;
        border: 1px solid #d1d5db !important;
      }
      .ol-control button:hover {
        background-color: #f3f4f6 !important;
      }
      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
      #map {
        flex: 1;
        width: 100%;
        background: #111827;
      }
      #sidebar {
        scrollbar-width: thin;
        scrollbar-color: #4b5563 transparent;
        transition: width 0.2s ease, opacity 0.2s ease;
      }
      #sidebar.collapsed {
        width: 0 !important;
        opacity: 0;
        overflow: hidden;
        border: 0;
      }
      #sidebar::-webkit-scrollbar {
        width: 6px;
      }
      #sidebar::-webkit-scrollbar-thumb {
        background-color: #4b5563;
        border-radius: 3px;
      }
      /* Scale bar styled for the dark background. */
      .ol-scale-line {
        background: rgba(31, 41, 55, 0.8);
        border-radius: 4px;
        bottom: 12px;
        left: 12px;
        padding: 2px;
      }
      .ol-scale-line-inner {
        color: #e5e7eb;
        border-color: #e5e7eb;
        font-size: 11px;
      }
    </style>
  </head>

  <body class="bg-gray-900 text-gray-100 font-sans antialiased">
    <header
      class="bg-gray-800 border-b border-gray-700 shadow-sm z-10 shrink-0"
    >
      <div
        class="max-w-full mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between"
      >
        <div class="flex items-center gap-3">
          <button
            id="sidebar-toggle"
            title="Toggle sidebar"
            class="p-2 rounded-lg text-gray-300 hover:bg-gray-700 transition-colors"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              class="w-5 h-5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
              />
            </svg>
          </button>
          <div class="bg-primary-600 text-white p-1.5 rounded-lg">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              class="w-6 h-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5z"
              />
            </svg>
          </div>
          <h1 class="text-xl font-bold tracking-tight text-white">
            FastSlide <span class="text-primary-500">XYZ</span>
          </h1>
        </div>

        <div
          id="header-info"
          class="hidden md:flex gap-6 text-sm text-gray-400"
        >
          <span id="format-info" class="font-medium text-gray-300"></span>
          <span id="dimensions-info"></span>
        </div>

        <div class="flex items-center gap-3">
          <a
            id="files-link"
            href="/"
            class="hidden inline-flex items-center gap-1.5 rounded-lg bg-gray-700 px-3 py-1.5 text-sm font-medium text-gray-100 hover:bg-gray-600 transition-colors"
            title="Back to file browser"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              class="w-4 h-4"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z"
              />
            </svg>
            Files
          </a>
          <label class="text-sm text-gray-400">Tile format</label>
          <select
            id="format-select"
            class="rounded-lg bg-gray-900 border border-gray-700 text-gray-200 text-sm py-1.5 px-3 focus:border-primary-500 focus:ring-primary-500"
          >
            <option value="jpg">JPEG</option>
            <option value="png">PNG</option>
          </select>
        </div>
      </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
      <aside
        id="sidebar"
        class="w-80 bg-gray-800 border-r border-gray-700 flex-shrink-0 overflow-y-auto"
      >
        <div class="p-6 space-y-6">
          <div id="image-switcher" class="hidden">
            <h2 class="text-lg font-semibold text-primary-400 mb-4">Image</h2>
            <select
              id="image-select"
              class="w-full rounded-lg bg-gray-900 border border-gray-700 text-gray-200 text-sm py-2 px-3 focus:border-primary-500 focus:ring-primary-500"
            ></select>
          </div>

          <div>
            <h2 class="text-lg font-semibold text-primary-400 mb-4">
              Slide Details
            </h2>
            <div
              class="space-y-3 bg-gray-900/50 p-4 rounded-xl border border-gray-700/50"
            >
              <div class="flex justify-between text-sm">
                <span class="text-gray-500">Name</span>
                <span
                  class="font-medium text-gray-200 truncate ml-2"
                  id="info-name"
                  >-</span
                >
              </div>
              <div class="flex justify-between text-sm">
                <span class="text-gray-500">Format</span>
                <span class="font-medium text-gray-200" id="info-format"
                  >-</span
                >
              </div>
              <div class="flex justify-between text-sm">
                <span class="text-gray-500">Dimensions</span>
                <span class="font-medium text-gray-200" id="info-dimensions"
                  >-</span
                >
              </div>
              <div class="flex justify-between text-sm">
                <span class="text-gray-500">MPP (µm/px)</span>
                <span class="font-medium text-gray-200" id="info-mpp">-</span>
              </div>
              <div class="flex justify-between text-sm">
                <span class="text-gray-500">Native levels</span>
                <span class="font-medium text-gray-200" id="info-levels"
                  >-</span
                >
              </div>
              <div class="flex justify-between text-sm">
                <span class="text-gray-500">Zoom levels</span>
                <span class="font-medium text-gray-200" id="info-zoom">-</span>
              </div>
              <div class="flex justify-between text-sm">
                <span class="text-gray-500">Tile size</span>
                <span class="font-medium text-gray-200" id="info-tile">-</span>
              </div>
            </div>
          </div>

          <div>
            <h2 class="text-lg font-semibold text-primary-400 mb-4">
              Annotations
            </h2>
            <div
              class="space-y-4 bg-gray-900/50 p-4 rounded-xl border border-gray-700/50"
            >
              <label
                class="flex items-center justify-between text-sm cursor-pointer"
              >
                <span class="text-gray-300">Show annotations</span>
                <input
                  id="annotation-toggle"
                  type="checkbox"
                  checked
                  class="h-4 w-4 rounded border-gray-600 bg-gray-900 text-primary-500 focus:ring-primary-500"
                />
              </label>

              <div class="flex items-center justify-between text-sm">
                <span class="text-gray-500">Circle diameter (mm)</span>
                <input
                  id="annotation-diameter"
                  type="number"
                  min="0.01"
                  step="0.01"
                  value="2.10"
                  class="w-24 rounded-lg bg-gray-900 border border-gray-700 text-gray-200 text-sm py-1 px-2 focus:border-primary-500 focus:ring-primary-500"
                />
              </div>

              <div class="border-t border-gray-700/50 pt-3">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-xs font-medium uppercase tracking-wide text-gray-500"
                    >Layers</span
                  >
                  <span class="text-xs text-gray-500" id="annotation-count"
                    >0 layers, 0 features</span
                  >
                </div>
                <div id="annotation-list" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                  <p class="text-xs text-gray-600">No annotation layers loaded.</p>
                </div>
              </div>

              <div>
                <label class="block text-xs text-gray-500 mb-1"
                  >Load GeoJSON file(s)</label
                >
                <input
                  id="annotation-file"
                  type="file"
                  multiple
                  accept=".json,.geojson,application/json,application/geo+json"
                  class="block w-full text-xs text-gray-400 file:mr-3 file:rounded-lg file:border-0 file:bg-primary-600 file:px-3 file:py-1.5 file:text-sm file:font-medium file:text-white hover:file:bg-primary-700 cursor-pointer"
                />
              </div>
            </div>
          </div>
        </div>
      </aside>

      <div id="viewer-container" class="flex-1 relative bg-gray-900">
        <div id="map" class="absolute inset-0"></div>
      </div>
    </main>

    <script>
      let map = null;
      let layer = null;
      let slideInfo = null;
      let currentImageIndex = 0;

      // --- Annotations ---------------------------------------------------
      // GeoJSON coordinates are in level-0 slide pixels with the origin at the
      // top-left and y pointing down. The map projection uses the same x but a
      // downward-negative y (extent [0, -height, width, 0]), so the only
      // transform needed is y -> -y. Point geometries are drawn as circles of a
      // fixed physical diameter (mm); other geometries are drawn as-is.
      //
      // Every annotation file for a slide becomes its own "group": a vector
      // source/layer plus a visibility flag, so each can be toggled on its own.
      const geojsonFormat = new ol.format.GeoJSON();
      let annotationGroups = []; // [{ name, data, source, layer, visible }]
      let pointDiameterMm = 2.1; // physical diameter of point circles, in mm
      let annotationsVisible = true; // master toggle for all groups

      const ANNOTATION_PALETTE = [
        "#f87171",
        "#fbbf24",
        "#34d399",
        "#60a5fa",
        "#c084fc",
        "#f472b6",
        "#22d3ee",
        "#a3e635",
      ];
      const classColors = {};

      function colorForClass(name) {
        const key = name || "__default__";
        if (!(key in classColors)) {
          const idx = Object.keys(classColors).length % ANNOTATION_PALETTE.length;
          classColors[key] = ANNOTATION_PALETTE[idx];
        }
        return classColors[key];
      }

      function classNameOf(props) {
        return props && props.classification && props.classification.name
          ? props.classification.name
          : null;
      }

      // Distinct classification names present in a GeoJSON object, for display
      // in the sidebar panel (the names are not drawn on the image).
      function classNamesOf(data) {
        const names = [];
        if (!data || !Array.isArray(data.features)) return names;
        data.features.forEach((f) => {
          const name = classNameOf(f.properties || {});
          if (name && !names.includes(name)) names.push(name);
        });
        return names;
      }

      // Returns the [r, g, b] color for a feature: the GeoJSON
      // classification.color when present, otherwise a palette color keyed by
      // the classification name.
      function rgbForFeature(props) {
        const c = props && props.classification && props.classification.color;
        if (Array.isArray(c) && c.length >= 3) {
          return [c[0] | 0, c[1] | 0, c[2] | 0];
        }
        const hex = colorForClass(classNameOf(props));
        const n = parseInt(hex.slice(1), 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      }

      function cssRgb(rgb, alpha) {
        return alpha == null
          ? `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`
          : `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${alpha})`;
      }

      // Flip the y axis in-place for a flat coordinate array (works for any
      // geometry dimensionality/stride).
      function flipY(input, output, stride) {
        output = output || input;
        for (let i = 0; i < input.length; i += stride) {
          output[i] = input[i];
          output[i + 1] = -input[i + 1];
          for (let k = 2; k < stride; k++) output[i + k] = input[i + k];
        }
        return output;
      }

      function makeCircleFeature(coord, radius, props) {
        const feature = new ol.Feature(
          new ol.geom.Circle([coord[0], -coord[1]], radius)
        );
        feature.setProperties(props || {});
        return feature;
      }

      function annotationStyle(feature) {
        const props = feature.getProperties();
        const rgb = rgbForFeature(props);
        const geom = feature.getGeometry();
        const isCircle = geom && geom.getType() === "Circle";
        // No on-image text labels: classification names are shown only in the
        // sidebar Annotations panel. Point circles are outline-only; region
        // geometries keep a faint translucent fill.
        return new ol.style.Style({
          stroke: new ol.style.Stroke({ color: cssRgb(rgb), width: 2 }),
          fill: isCircle
            ? undefined
            : new ol.style.Fill({ color: cssRgb(rgb, 0.15) }),
        });
      }

      function updateAnnotationCount() {
        const el = document.getElementById("annotation-count");
        if (!el) return;
        let n = 0;
        annotationGroups.forEach((g) => (n += g.source.getFeatures().length));
        const layers = annotationGroups.length;
        el.textContent = `${layers} layer${layers === 1 ? "" : "s"}, ${n} feature${
          n === 1 ? "" : "s"
        }`;
      }

      // Mean microns-per-pixel of the current image, or null if the slide has
      // no physical scale. Map units are level-0 pixels, so converting a
      // physical length to map units uses this scale directly.
      function currentImageMpp() {
        if (!slideInfo || !slideInfo.images) return null;
        const image = slideInfo.images[currentImageIndex];
        if (!image || !image.mpp) return null;
        const [mx, my] = image.mpp;
        return (mx + my) / 2;
      }

      // Converts a physical diameter (mm) to a circle radius in level-0 pixels
      // using the current image's MPP. Returns null when the scale is unknown.
      function pointRadiusPixels() {
        const mpp = currentImageMpp(); // microns per pixel
        if (!mpp || mpp <= 0) return null;
        const diameterMicrons = pointDiameterMm * 1000;
        return diameterMicrons / mpp / 2;
      }

      // Builds OpenLayers features from one GeoJSON object, converting points to
      // circles of the given radius (px) and flipping y for every geometry.
      function buildFeatures(data, radius) {
        const out = [];
        if (!data || !Array.isArray(data.features)) return out;
        data.features.forEach((feature) => {
          const geom = feature.geometry;
          if (!geom) return;
          const props = Object.assign({}, feature.properties || {});
          if (geom.type === "Point" || geom.type === "MultiPoint") {
            // Point circles need a physical scale; skip them if MPP is unknown.
            if (radius === null) return;
            const coords =
              geom.type === "Point" ? [geom.coordinates] : geom.coordinates;
            coords.forEach((c) => out.push(makeCircleFeature(c, radius, props)));
          } else {
            let olGeom;
            try {
              olGeom = geojsonFormat.readGeometry(geom);
            } catch (err) {
              return;
            }
            olGeom.applyTransform(flipY);
            const olFeature = new ol.Feature(olGeom);
            olFeature.setProperties(props);
            out.push(olFeature);
          }
        });
        return out;
      }

      // Recompute features for every group (e.g. after the diameter or image,
      // and therefore the MPP, changes).
      function rebuildAllAnnotationFeatures() {
        const radius = pointRadiusPixels();
        annotationGroups.forEach((g) => {
          g.source.clear();
          g.source.addFeatures(buildFeatures(g.data, radius));
        });
        updateAnnotationCount();
      }

      // (Re)create a vector layer per group on the current map. Layers are
      // rebuilt fresh because the map itself is recreated on image/format
      // changes, but the underlying sources persist.
      function syncAnnotationLayers() {
        if (!map) return;
        annotationGroups.forEach((g) => {
          if (g.layer) {
            try {
              map.removeLayer(g.layer);
            } catch (err) {
              /* layer not on this map */
            }
          }
          g.layer = new ol.layer.Vector({
            source: g.source,
            style: annotationStyle,
            visible: annotationsVisible && g.visible,
          });
          map.addLayer(g.layer);
        });
      }

      function setAnnotationsVisible(visible) {
        annotationsVisible = visible;
        annotationGroups.forEach((g) => {
          if (g.layer) g.layer.setVisible(annotationsVisible && g.visible);
        });
      }

      // Renders the per-layer visibility checklist in the sidebar.
      function renderAnnotationList() {
        const container = document.getElementById("annotation-list");
        if (!container) return;
        container.innerHTML = "";
        if (annotationGroups.length === 0) {
          container.innerHTML =
            '<p class="text-xs text-gray-600">No annotation layers loaded.</p>';
          return;
        }
        annotationGroups.forEach((g) => {
          const row = document.createElement("label");
          row.className =
            "flex items-start justify-between gap-2 text-sm cursor-pointer";

          const labels = document.createElement("div");
          labels.className = "min-w-0";
          const name = document.createElement("div");
          name.className = "text-gray-300 truncate";
          name.textContent = g.name;
          name.title = g.name;
          labels.appendChild(name);
          const classes = classNamesOf(g.data);
          if (classes.length) {
            const sub = document.createElement("div");
            sub.className = "text-xs text-gray-500 truncate";
            sub.textContent = classes.join(", ");
            sub.title = classes.join(", ");
            labels.appendChild(sub);
          }

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = g.visible;
          checkbox.className =
            "mt-0.5 h-4 w-4 rounded border-gray-600 bg-gray-900 text-primary-500 focus:ring-primary-500 shrink-0";
          checkbox.addEventListener("change", () => {
            g.visible = checkbox.checked;
            if (g.layer) g.layer.setVisible(annotationsVisible && g.visible);
          });

          row.appendChild(labels);
          row.appendChild(checkbox);
          container.appendChild(row);
        });
      }

      // Appends new annotation groups, builds their features, wires up layers,
      // and refreshes the sidebar list.
      function addAnnotationGroups(entries) {
        entries.forEach((entry) => {
          annotationGroups.push({
            name: entry.name,
            data: entry.data,
            source: new ol.source.Vector(),
            layer: null,
            visible: true,
          });
        });
        rebuildAllAnnotationFeatures();
        syncAnnotationLayers();
        renderAnnotationList();
      }

      async function loadAnnotationsFromServer() {
        try {
          const resp = await fetch(withSlide("/annotations"));
          if (!resp.ok) return;
          const data = await resp.json();
          const list = Array.isArray(data.annotations) ? data.annotations : [];
          addAnnotationGroups(
            list.map((a) => ({ name: a.name, data: a.geojson }))
          );
        } catch (err) {
          // No annotations available; leave the overlay empty.
        }
      }

      // Loads one or more local GeoJSON files, each as its own layer.
      function loadAnnotationsFromFiles(fileList) {
        const files = Array.from(fileList);
        let pending = files.length;
        const entries = [];
        const done = () => {
          if (--pending === 0 && entries.length) addAnnotationGroups(entries);
        };
        files.forEach((file) => {
          const reader = new FileReader();
          reader.onload = () => {
            try {
              entries.push({
                name: file.name.replace(/\.(geo)?json$/i, ""),
                data: JSON.parse(reader.result),
              });
            } catch (err) {
              alert(`Could not parse ${file.name} as GeoJSON.`);
            }
            done();
          };
          reader.onerror = done;
          reader.readAsText(file);
        });
      }

      // When served by the multi-image (folder) server, the slide to view is
      // passed as a ?slide=<relpath> query param that must be forwarded to the
      // /info and /tiles endpoints. The single-slide server ignores it.
      const slideParam = new URLSearchParams(window.location.search).get(
        "slide"
      );

      function withSlide(url) {
        if (!slideParam) return url;
        const sep = url.includes("?") ? "&" : "?";
        return url + sep + "slide=" + encodeURIComponent(slideParam);
      }

      function currentImage() {
        return slideInfo.images[currentImageIndex];
      }

      function tileUrl(imageIndex, z, x, y, ext) {
        return withSlide(`/tiles/${imageIndex}/${z}/${x}/${y}.${ext}`);
      }

      function buildSource(image, ext) {
        const [width, height] = image.dimensions;
        const tileSize = image.tile_size;

        // Coordinate system: image pixels, y pointing down. The extent's top
        // edge is y=0 and the bottom edge is y=-height, with the tile grid
        // origin anchored at the top-left so XYZ rows increase downward.
        const extent = [0, -height, width, 0];

        // One zoom level per native pyramid level; resolutions are the slide's
        // own downsamples (not necessarily powers of two). OpenLayers scales
        // between these client-side, so the server never resamples.
        const resolutions = image.resolutions.slice();

        // Set meters-per-unit from MPP so the scale bar reads in real units
        // (1 map unit = 1 level-0 pixel = mpp_x microns = mpp_x * 1e-6 m).
        const projOpts = {
          code: "fastslide-pixels",
          units: "pixels",
          extent: extent,
        };
        if (image.mpp) {
          projOpts.metersPerUnit = image.mpp[0] * 1e-6;
        }
        const projection = new ol.proj.Projection(projOpts);

        const tileGrid = new ol.tilegrid.TileGrid({
          extent: extent,
          origin: [0, 0],
          resolutions: resolutions,
          tileSize: tileSize,
        });

        const source = new ol.source.XYZ({
          projection: projection,
          tileGrid: tileGrid,
          wrapX: false,
          tileUrlFunction: function (tileCoord) {
            if (!tileCoord) return undefined;
            const z = tileCoord[0];
            const x = tileCoord[1];
            const y = tileCoord[2];
            if (x < 0 || y < 0) return undefined;
            return tileUrl(image.index, z, x, y, ext);
          },
        });

        return { source, projection, resolutions, extent };
      }

      function createMap(image, ext) {
        const { source, projection, resolutions, extent } = buildSource(
          image,
          ext
        );

        layer = new ol.layer.Tile({ source });

        if (map) {
          map.setTarget(null);
          map = null;
        }

        // The tile grid only goes as coarse as the slide's coarsest native
        // level (resolutions[0]). To let the user zoom out far enough to fit
        // the whole slide, give the View extra coarser steps; OpenLayers scales
        // the coarsest tiles down for those without requesting new tiles.
        const [width, height] = image.dimensions;
        const viewResolutions = resolutions.slice();
        const maxRes = Math.max(width, height) / 200;
        let currentMax = viewResolutions[0];
        while (currentMax < maxRes) {
          currentMax *= 2;
          viewResolutions.unshift(currentMax);
        }

        const controls = ol.control.defaults
          .defaults()
          .extend([new ol.control.FullScreen(), new ol.control.ZoomSlider()]);
        if (image.mpp) {
          controls.extend([
            new ol.control.ScaleLine({ units: "metric", minWidth: 80 }),
          ]);
        }

        map = new ol.Map({
          target: "map",
          layers: [layer],
          view: new ol.View({
            projection: projection,
            resolutions: viewResolutions,
            extent: extent,
            constrainOnlyCenter: true,
            showFullExtent: true,
            enableRotation: false,
          }),
          controls: controls,
        });

        map.getView().fit(extent, { padding: [20, 20, 20, 20] });

        // Re-attach annotation layers; the map was just recreated.
        syncAnnotationLayers();
      }

      function populateImageSwitcher() {
        const switcher = document.getElementById("image-switcher");
        const select = document.getElementById("image-select");
        select.innerHTML = "";
        if (slideInfo.images.length <= 1) {
          switcher.classList.add("hidden");
          return;
        }
        switcher.classList.remove("hidden");
        slideInfo.images.forEach((img) => {
          const option = document.createElement("option");
          option.value = img.index;
          const label = img.name || `Image ${img.index}`;
          option.textContent = `${label} (${img.dimensions[0]}×${img.dimensions[1]})`;
          select.appendChild(option);
        });
        select.value = currentImageIndex;
      }

      function populateSidebar() {
        const image = currentImage();
        document.getElementById("info-name").textContent =
          slideInfo.name || "-";
        document.getElementById("info-format").textContent =
          slideInfo.format || "-";
        document.getElementById("format-info").textContent =
          slideInfo.format || "";
        const dims = `${image.dimensions[0]} × ${image.dimensions[1]}`;
        document.getElementById("info-dimensions").textContent = dims;
        document.getElementById("dimensions-info").textContent = dims;
        document.getElementById("info-mpp").textContent = image.mpp
          ? ((image.mpp[0] + image.mpp[1]) / 2).toFixed(4)
          : "N/A";
        document.getElementById("info-levels").textContent = image.level_count;
        document.getElementById(
          "info-zoom"
        ).textContent = `${image.min_zoom} – ${image.max_zoom}`;
        document.getElementById(
          "info-tile"
        ).textContent = `${image.tile_size} px`;
      }

      function selectImage(index) {
        currentImageIndex = index;
        populateSidebar();
        createMap(
          currentImage(),
          document.getElementById("format-select").value
        );
        // Point circle sizes depend on the image's MPP, so rebuild on switch.
        rebuildAllAnnotationFeatures();
      }

      async function init() {
        if (slideParam) {
          document.getElementById("files-link").classList.remove("hidden");
        }
        const resp = await fetch(withSlide("/info"));
        if (!resp.ok) {
          document.getElementById("map").innerHTML =
            '<div class="flex items-center justify-center h-full text-red-400">Failed to load slide info</div>';
          return;
        }
        slideInfo = await resp.json();
        currentImageIndex = slideInfo.primary_index || 0;

        populateImageSwitcher();
        selectImage(currentImageIndex);

        loadAnnotationsFromServer();

        document
          .getElementById("format-select")
          .addEventListener("change", (e) => {
            createMap(currentImage(), e.target.value);
          });

        document
          .getElementById("annotation-toggle")
          .addEventListener("change", (e) => {
            setAnnotationsVisible(e.target.checked);
          });

        document
          .getElementById("annotation-diameter")
          .addEventListener("change", (e) => {
            const value = parseFloat(e.target.value);
            if (value > 0) {
              pointDiameterMm = value;
              rebuildAllAnnotationFeatures();
            }
          });

        document
          .getElementById("annotation-file")
          .addEventListener("change", (e) => {
            if (e.target.files && e.target.files.length) {
              loadAnnotationsFromFiles(e.target.files);
            }
            e.target.value = ""; // allow re-selecting the same file(s)
          });

        document
          .getElementById("image-select")
          .addEventListener("change", (e) => {
            selectImage(parseInt(e.target.value, 10));
          });

        document
          .getElementById("sidebar-toggle")
          .addEventListener("click", () => {
            document.getElementById("sidebar").classList.toggle("collapsed");
            // Let the layout settle before OpenLayers recomputes its size.
            setTimeout(() => map && map.updateSize(), 220);
          });
      }

      init();
    </script>
  </body>
</html>
